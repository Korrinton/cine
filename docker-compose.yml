services:
  # PHP y la aplicación (laravel-app)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - peliculas-network

  # Servidor Web (Nginx)
  nginx:
    image: nginx:stable-alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - peliculas-network
    depends_on:
      - app

  # Base de Datos (MySQL) - AQUÍ ESTÁ LO IMPORTANTE PARA TU .ENV
  mysql:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      # Usamos las variables exactas de tu .env
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - peliculas-network

networks:
  peliculas-network:
    driver: bridge

volumes:
  dbdata: